<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Uncensored YouTube</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Uncensored YouTube</h1>
      <p class="description">Choose how hidden words are restored.</p>
      <input id="mode" type="range" min="0" max="4" step="1" aria-describedby="modeDetails">
      <ol class="stops" aria-hidden="true">
        <li>Off</li><li>Rules</li><li>Rules first</li><li>Whisper first</li><li>Whisper</li>
      </ol>
      <section id="modeDetails" aria-live="polite">
        <strong id="modeTitle"></strong>
        <small id="modeDescription"></small>
        <dl>
          <dt>Precision</dt><dd id="modePrecision"></dd>
          <dt>Coverage</dt><dd id="modeCoverage"></dd>
          <dt>CPU load</dt><dd id="modeCpu"></dd>
        </dl>
      </section>
      <p class="note">Best-case figures from the English videos the rules were tuned on; expect lower elsewhere.</p>
      <footer>
        <small id="versionLabel" class="version"></small>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
