<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Uncensored YouTube</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Uncensored YouTube</h1>
      <p class="coverage">
        <strong id="coverageLabel"></strong>
      </p>
      <label>
        <input id="rulesEnabled" type="checkbox">
        <span>
          <strong>Context Rules</strong>
          <small>Predict common swears from caption context.</small>
        </span>
      </label>
      <label>
        <input id="whisperEnabled" type="checkbox">
        <span>
          <strong>Audio Inference</strong>
          <small>Use local Whisper Tiny to transcribe swears.</small>
        </span>
      </label>
      <footer>
        <span class="info" tabindex="0" aria-label="Benchmark details" aria-describedby="benchmarkTooltip">i
          <span id="benchmarkTooltip" class="tooltip" role="tooltip"></span>
        </span>
        <small id="versionLabel" class="version"></small>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
