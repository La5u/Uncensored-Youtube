<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Uncensored YouTube</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Uncensored YouTube</h1>
      <p class="recommendation">
        <strong>Recommended: Hybrid (default)</strong>
        <small>Both options: 91.1% precision, 85.8% correct coverage, and about 26% fewer Whisper transcriptions than audio-only.</small>
      </p>
      <label>
        <input id="rulesEnabled" type="checkbox">
        <span>
          <strong>Context Rules</strong>
          <small>Predict common swears from context. Rules-only: 80.3% precision and 34.0% correct coverage.</small>
        </span>
      </label>
      <label>
        <input id="whisperEnabled" type="checkbox">
        <span>
          <strong>Audio Inference</strong>
          <small>Use local Whisper Tiny to transcribe swears. Audio-only: 90.3% precision and 85.4% correct coverage.</small>
        </span>
      </label>
      <small class="benchmark">Benchmark: 1,448 scored slots from 54 videos with separate English captions.</small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
