<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Uncensored YouTube</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Uncensored YouTube</h1>
      <label>
        <input id="rulesEnabled" type="checkbox">
        <span>
          <strong>Context Rules</strong>
          <small>Use regex to predict common swears from surrounding context. Low resource use; ~85% accuracy, ~42% misses.</small>
        </span>
      </label>
      <label>
        <input id="whisperEnabled" type="checkbox">
        <span>
          <strong>Audio Inference</strong>
          <small>Uses the local Whisper Tiny model to transcribe swears and update subtitles live. Resource-intensive and buggy; ~95% accuracy, ~3% misses.</small>
        </span>
      </label>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
